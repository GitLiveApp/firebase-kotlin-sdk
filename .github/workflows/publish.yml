# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Publish

on:
  release:
    types: [ prereleased, released ]
  workflow_dispatch:
    inputs:
      skip:
        description: 'Modules not to publish, space-separated (e.g. "firebase-analytics firebase-app" to finish a release that stopped part way)'
        required: false
        default: ''

env:
  ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPEUSERNAME }}
  ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPEPASSWORD }}
  ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
  ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.PASSPHRASE }}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4.1'
      - name: Publish Firebase Analytics
        if: ${{ !contains(format(' {0} ', inputs.skip), ' firebase-analytics ') }}
        run: ./gradlew :firebase-analytics:publish
      - name: Publish Firebase App
        if: ${{ !contains(format(' {0} ', inputs.skip), ' firebase-app ') }}
        run: ./gradlew :firebase-app:publish
      - name: Publish Firebase Auth
        if: ${{ !contains(format(' {0} ', inputs.skip), ' firebase-auth ') }}
        run: ./gradlew :firebase-auth:publish
      - name: Publish Firebase Common
        if: ${{ !contains(format(' {0} ', inputs.skip), ' firebase-common ') }}
        run: ./gradlew :firebase-common:publish
      - name: Publish Firebase Common Internal
        if: ${{ !contains(format(' {0} ', inputs.skip), ' firebase-common-internal ') }}
        run: ./gradlew :firebase-common-internal:publish
      - name: Publish Firebase Config
        if: ${{ !contains(format(' {0} ', inputs.skip), ' firebase-config ') }}
        run: ./gradlew :firebase-config:publish
      - name: Publish Firebase Database
        if: ${{ !contains(format(' {0} ', inputs.skip), ' firebase-database ') }}
        run: ./gradlew :firebase-database:publish
      - name: Publish Firebase Firestore
        if: ${{ !contains(format(' {0} ', inputs.skip), ' firebase-firestore ') }}
        run: ./gradlew :firebase-firestore:publish
      - name: Publish Firebase Functions
        if: ${{ !contains(format(' {0} ', inputs.skip), ' firebase-functions ') }}
        run: ./gradlew :firebase-functions:publish
      - name: Publish Firebase Messaging
        if: ${{ !contains(format(' {0} ', inputs.skip), ' firebase-messaging ') }}
        run: ./gradlew :firebase-messaging:publish
      - name: Publish Firebase Storage
        if: ${{ !contains(format(' {0} ', inputs.skip), ' firebase-storage ') }}
        run: ./gradlew :firebase-storage:publish
      - name: Publish Firebase Installations
        if: ${{ !contains(format(' {0} ', inputs.skip), ' firebase-installations ') }}
        run: ./gradlew :firebase-installations:publish
      - name: Publish Firebase Performance
        if: ${{ !contains(format(' {0} ', inputs.skip), ' firebase-perf ') }}
        run: ./gradlew :firebase-perf:publish
      - name: Publish Firebase Crashlytics
        if: ${{ !contains(format(' {0} ', inputs.skip), ' firebase-crashlytics ') }}
        run: ./gradlew :firebase-crashlytics:publish
  documentation:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: gradle/gradle-build-action@v3
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4.1'
      - name: Generate documentation
        run: ./gradlew dokkaHtmlMultiModule
      - name: Uploading build folder
        uses: actions/upload-artifact@v7
        with:
          name: artefact
          path: build/dokka/htmlMultiModule
      - name: Deploy API documentation to Github Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/dokka/htmlMultiModule
          target-folder: docs
