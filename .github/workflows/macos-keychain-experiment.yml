# Temporary: records non-fatal exceptions from the iOS simulator into the fir-kotlin-sdk project so they can be
# inspected in the Crashlytics console. Run manually; not meant to be merged.
name: Crashlytics console check

on:
  workflow_dispatch:

jobs:
  record-and-upload:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin/Native cache
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2.0'
      - name: Boot the simulator
        run: |
          open -a Simulator
          for i in $(seq 1 90); do
            xcrun simctl list devices booted -j | grep -q '"state" : "Booted"' && break
            sleep 2
          done
          xcrun simctl list devices booted
      - name: Stream Firebase logs
        # Firebase logs through os_log inside the simulator, which has its own logd, so stream from there.
        run: |
          xcrun simctl spawn booted log stream --level debug --style compact --predicate 'subsystem == "com.google.firebase"' > firebase-unified.log 2>&1 &
          echo $! > log-stream.pid
      - name: First run (records the non-fatals)
        run: ./gradlew :firebase-crashlytics:iosSimulatorArm64Test --tests "dev.gitlive.firebase.crashlytics.ConsoleCheckTest"
      - name: First run results
        if: always()
        run: cat firebase-crashlytics/build/test-results/iosSimulatorArm64Test/*.xml || true
      - name: Upload the test binary's dSYM to Crashlytics
        if: always()
        run: |
          set -x
          BIN_DIR=firebase-crashlytics/build/bin/iosSimulatorArm64/debugTest
          ls -la "$BIN_DIR"
          DSYM="$BIN_DIR/test.kexe.dSYM"
          if [ ! -d "$DSYM" ]; then xcrun dsymutil "$BIN_DIR/test.kexe" -o "$DSYM"; fi
          xcrun dwarfdump --uuid "$DSYM"
          xcrun dwarfdump --uuid "$BIN_DIR/test.kexe"
          UPLOAD=$(find firebase-crashlytics/build/cocoapods -type f -name upload-symbols | head -1)
          echo "upload-symbols: $UPLOAD"
          "$UPLOAD" -ai 1:846484016111:ios:dd1f6688bad7af768c841a -p ios "$DSYM"
      - name: Second run (uploads the first run's report)
        run: ./gradlew :firebase-crashlytics:cleanIosSimulatorArm64Test :firebase-crashlytics:iosSimulatorArm64Test --tests "dev.gitlive.firebase.crashlytics.ConsoleCheckTest"
      - name: Second run results
        if: always()
        run: cat firebase-crashlytics/build/test-results/iosSimulatorArm64Test/*.xml || true
      - name: Firebase logs
        if: always()
        run: |
          sleep 5
          kill "$(cat log-stream.pid)" || true
          sleep 2
          echo "===== streamed ====="
          cat firebase-unified.log
          echo "===== log show ====="
          xcrun simctl spawn booted log show --last 30m --info --debug --style compact --predicate 'subsystem == "com.google.firebase"' | tail -300

  android-record-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Setup test environment
        uses: ./.github/actions/setup_test_action
      - name: Apply Android licenses
        run: ./gradlew ciSdkManagerLicenses
      - name: Build the test APK
        run: ./gradlew :firebase-crashlytics:packageDebugAndroidTest && find firebase-crashlytics/build/outputs/apk -name "*.apk"
      - name: Run the test twice on an emulator (the second launch uploads the first's session)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -x
            APK=$(find firebase-crashlytics/build/outputs/apk/androidTest -name "*.apk" | head -1)
            adb install -r "$APK"
            adb shell setprop log.tag.FirebaseCrashlytics VERBOSE
            for run in first second; do
              adb logcat -c
              adb shell am instrument -w -e class dev.gitlive.firebase.crashlytics.ConsoleCheckAndroidTest dev.gitlive.firebase.crashlytics.test/androidx.test.runner.AndroidJUnitRunner
              echo "===== $run run logcat"
              adb logcat -d | grep -i "console-check\|FirebaseCrashlytics\|AndroidRuntime" | tail -250
            done
