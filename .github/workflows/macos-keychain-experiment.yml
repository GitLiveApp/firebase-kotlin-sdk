# Temporary: records non-fatal exceptions from the iOS simulator into the fir-kotlin-sdk project so they can be
# inspected in the Crashlytics console. Run manually; not meant to be merged.
name: Crashlytics console check

on:
  workflow_dispatch:

jobs:
  record-and-upload:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin/Native cache
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2.0'
      - name: Stream Firebase logs
        # Firebase logs through os_log, which never reaches the test process's stdout, so capture the unified log.
        run: |
          log stream --level debug --style compact --predicate 'subsystem == "com.google.firebase"' > firebase-unified.log 2>&1 &
          echo $! > log-stream.pid
      - name: First run (records the non-fatals)
        run: ./gradlew :firebase-crashlytics:iosSimulatorArm64Test --tests "dev.gitlive.firebase.crashlytics.ConsoleCheckTest"
      - name: Second run (uploads the first run's report)
        run: ./gradlew :firebase-crashlytics:cleanIosSimulatorArm64Test :firebase-crashlytics:iosSimulatorArm64Test --tests "dev.gitlive.firebase.crashlytics.ConsoleCheckTest"
      - name: Firebase logs
        if: always()
        run: |
          sleep 5
          kill "$(cat log-stream.pid)" || true
          sleep 2
          cat firebase-unified.log
