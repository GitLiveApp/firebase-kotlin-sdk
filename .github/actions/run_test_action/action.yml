name: 'Run Tests'
description: 'Runs a Gradle test matrix entry and uploads failure artifacts'

inputs:
  gradle-tasks:
    description: 'Gradle tasks and arguments to run'
    required: true
  platform-name:
    description: 'Display name used for step and artifact names'
    required: true
  report-paths:
    description: 'Newline-separated report paths to upload on failure'
    required: true
  android:
    description: 'Whether to enable Android emulator setup'
    required: false
    default: 'false'
  apple:
    description: 'Whether to enable Apple/Xcode setup'
    required: false
    default: 'false'
  xcode-version:
    description: >-
      Xcode version to select when apple is true. 26.4.1 is the newest Xcode that Kotlin 2.4.x is tested
      with (XcodeVersion.maxTested = 26.4); the runner image's default is newer.
    required: false
    default: '26.4.1'
  boot-simulator:
    description: >-
      Runtime prefix of a simulator to boot before running the tests, e.g. "tvOS".
      The Kotlin simulator test tasks attach to an already-booted device
      (standalone = false, device = "booted"), and `open -a Simulator` only brings up
      the default iOS device, so a non-iOS runtime has to be booted explicitly.
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Enable KVM group perms
      if: inputs.android == 'true'
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Restore SwiftPM cache
      id: swiftpm-cache
      if: inputs.apple == 'true'
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/Library/Caches/org.swift.swiftpm
        key: swiftpm-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
        restore-keys: |
          swiftpm-${{ runner.os }}-

    - name: Mark SwiftPM cache restore time
      if: inputs.apple == 'true'
      shell: bash
      run: touch "$RUNNER_TEMP/swiftpm-cache-restored"

    - uses: maxim-lobanov/setup-xcode@v1
      if: inputs.apple == 'true'
      with:
        xcode-version: ${{ inputs.xcode-version }}

    - name: Boot ${{ inputs.boot-simulator }} simulator
      if: inputs.boot-simulator != ''
      shell: bash
      run: |
        set -euo pipefail
        udid=$(xcrun simctl list devices available -j | python3 -c "
        import json, sys
        devices = json.load(sys.stdin)['devices']
        for runtime, entries in devices.items():
            if '${{ inputs.boot-simulator }}' in runtime and entries:
                print(entries[0]['udid']); break
        else:
            sys.exit('No available ${{ inputs.boot-simulator }} simulator')
        ")
        echo "Booting ${{ inputs.boot-simulator }} simulator $udid"
        xcrun simctl boot "$udid"
        xcrun simctl bootstatus "$udid" -b

    - name: Setup test environment
      uses: ./.github/actions/setup_test_action

    - name: Set artifact name
      shell: bash
      run: |
        echo "ARCHIVE_KEY=$(echo ${{ inputs.gradle-tasks }} | cut -d: -f2)" >> $GITHUB_ENV

    - name: Apply Android licenses
      if: inputs.android == 'true'
      shell: bash
      run: ./gradlew ciSdkManagerLicenses

    - name: Run ${{ inputs.platform-name }} Tests
      shell: bash
      run: ./gradlew ${{ inputs.gradle-tasks }}

    # Only a job that resolved packages writes the SwiftPM cache. The modules without SwiftPM dependencies
    # (firebase-common, firebase-common-internal, test-utils) resolve nothing and finish first, so letting them
    # save would store whatever was restored, or nothing, under a new key.
    - name: Check whether SwiftPM used its cache
      id: swiftpm-cache-used
      if: inputs.apple == 'true' && steps.swiftpm-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cache=~/Library/Caches/org.swift.swiftpm
        # A Firebase module resolves the shared lock group, which writes this lock file. It is the signal even when
        # SwiftPM resolved entirely from a restored cache and wrote nothing new to it.
        if compgen -G ".swiftpm-locks/*/swiftImport/Package.resolved" > /dev/null; then
          echo "used=true" >> "$GITHUB_OUTPUT"
        elif [ -d "$cache" ] && [ -n "$(find "$cache" -newer "$RUNNER_TEMP/swiftpm-cache-restored" -print -quit)" ]; then
          echo "used=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Save SwiftPM cache
      if: steps.swiftpm-cache-used.outputs.used == 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          ~/Library/Caches/org.swift.swiftpm
        key: ${{ steps.swiftpm-cache.outputs.cache-primary-key }}

    - name: Upload ${{ inputs.platform-name }} test artifact
      uses: actions/upload-artifact@v5
      if: failure()
      with:
        name: ${{ inputs.platform-name }} ${{ env.ARCHIVE_KEY }} Test Report HTML
        path: ${{ inputs.report-paths }}

    - name: Upload Firebase Debug Log
      uses: actions/upload-artifact@v5
      if: failure()
      with:
        name: ${{ inputs.platform-name }} ${{ env.ARCHIVE_KEY }} Firebase Debug Log
        path: "**/firebase-debug.log"

    # What Kotlin's SwiftPM import resolved and passed to cinterop and the linker. Leaves out the xcodebuild
    # DerivedData (swiftImportDd) and package checkouts (swiftPMCheckouts), which are large.
    - name: Upload SwiftPM import diagnostics
      uses: actions/upload-artifact@v5
      if: failure() && inputs.apple == 'true'
      with:
        name: ${{ inputs.platform-name }} ${{ env.ARCHIVE_KEY }} SwiftPM import diagnostics
        # .swiftpm-locks is a dot-directory, which upload-artifact skips unless hidden files are included
        include-hidden-files: true
        if-no-files-found: ignore
        path: |
          .swiftpm-locks/*/swiftImport/Package.resolved
          build/kotlin/swiftSyntheticPackages/*/Package.swift
          build/kotlin/swiftSyntheticPackages/*/Package.resolved
          build/kotlin/swiftPMXcodeDumps/*/swiftImportClangDump/**
          **/build/kotlin/swiftImport/Package.swift
          **/build/kotlin/swiftImport/Package.resolved
          **/build/kotlin/swiftImportClangDump/**
          **/build/kotlin/swiftImportDefs/**
          **/build/kotlin/swiftImportLdDump/**
          **/build/kotlin/xcodebuildFingerprints/**
          **/build/kotlin/syntheticPackageFingerprint
